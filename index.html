<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>COMPUTER - Drag and Drop</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>


    <header>
        <h1>COMPUTER - Lesson 1</h1>
        <p>Drag and Drop</p>
    </header>

    <div class="container">
        <aside class="help-box-panel">
            <h2 class="panel-title">Help Box</h2>
            <div class="help-box" id="helpBox"></div>
        </aside>

        <main class="questions-panel">
            <h2 class="panel-title">Questions</h2>
            <div id="questionsContainer" class="questions-container"></div>
        </main>

        <div class="action-container">
            <button class="btn-submit" id="submitBtn">Submit Answers</button>
            <div class="result-box" id="resultBox"></div>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
